name: PAW TaskGate v2 opt-in regression

on:
  push:
    branches:
      - feature/taskgate-v2-optin-integration
    paths:
      - "paw-v3.0/**"
      - ".github/workflows/taskgate-v2-optin-regression.yml"
  workflow_dispatch:

jobs:
  cpu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile PAW and TaskGate code
        run: python -m compileall -q paw-v3.0/paw paw-v3.0/tests
      - name: Run TaskGate v2 integration regression
        working-directory: paw-v3.0
        run: python -m unittest discover -s tests -p "test_task_gate_integration.py" -v
