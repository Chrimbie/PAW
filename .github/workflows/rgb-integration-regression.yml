name: PAW RGB input and fallback integration regression
on:
  push:
    branches: [feature/rgb-gate-default-integration-20261031]
    paths:
      - "paw-v3.0/**"
      - ".github/workflows/rgb-integration-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile PAW
        run: python -m compileall -q paw-v3.0/paw paw-v3.0/tests
      - name: Run legacy and RGB safety regressions
        working-directory: paw-v3.0
        run: |
          python -m unittest discover -s tests -p "test_task_gate_integration.py" -v
          python -m unittest discover -s tests -p "test_rgb_integration.py" -v
